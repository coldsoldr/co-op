name: worker

# Tests the feedback Worker and deploys it to Cloudflare. Deploying needs the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/deploying-the-worker.md); without them
# the deploy step is skipped and the job still passes. Only main is ever deployed.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @co-op/shared test
      - run: pnpm --filter @co-op/worker typecheck
      - run: pnpm --filter @co-op/worker test
      # Proves wrangler.toml and the bundle are valid without any credentials.
      - run: pnpm --filter @co-op/worker exec wrangler deploy --dry-run --outdir dist
        env:
          WRANGLER_SEND_METRICS: 'false'
      # Secrets cannot be read in `if:`, so this step turns their presence into an output.
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Worker not deployed::Only main is deployed; this run is for $REF."
          elif [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Worker not deployed::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set. See docs/deploying-the-worker.md."
          fi
      # The optional repository secrets FEEDBACK_GITHUB_TOKEN and TURNSTILE_SECRET are uploaded
      # with the deploy itself (--secrets-file), so even the first deploy has them and a renewed
      # token takes effect on the next run. Secrets left unset keep their current values, such
      # as ones the owner set with `wrangler secret put`.
      - if: steps.check.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPO_FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
          REPO_TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          node -e '
            const out = {};
            if (process.env.REPO_FEEDBACK_GITHUB_TOKEN) out.GITHUB_TOKEN = process.env.REPO_FEEDBACK_GITHUB_TOKEN;
            if (process.env.REPO_TURNSTILE_SECRET) out.TURNSTILE_SECRET = process.env.REPO_TURNSTILE_SECRET;
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(out), { mode: 0o600 });
            console.log("secrets uploaded with this deploy: " + (Object.keys(out).join(", ") || "none"));
          ' "$secrets"
          pnpm exec wrangler deploy --secrets-file "$secrets"
