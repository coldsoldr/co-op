name: worker

# Tests the feedback Worker and deploys it to Cloudflare. Deploying needs the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/deploying-the-worker.md); without them
# the deploy steps are skipped and the job still passes.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @co-op/shared test
      - run: pnpm --filter @co-op/worker typecheck
      - run: pnpm --filter @co-op/worker test
      # Proves wrangler.toml and the bundle are valid without any credentials.
      - run: pnpm --filter @co-op/worker exec wrangler deploy --dry-run --outdir dist
        env:
          WRANGLER_SEND_METRICS: 'false'
      # Secrets cannot be read in `if:`, so this step turns their presence into an output.
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Worker not deployed::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set. See docs/deploying-the-worker.md."
          fi
      - if: steps.check.outputs.ready == 'true'
        run: pnpm --filter @co-op/worker exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      # Optional: keeps the Worker's secrets in step with repository secrets of the same purpose.
      # Each is only written when its repository secret is set; otherwise `wrangler secret put`
      # run once by the owner is what the Worker uses.
      - if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          WRANGLER_SEND_METRICS: 'false'
        working-directory: worker
        run: |
          if [ -n "$FEEDBACK_GITHUB_TOKEN" ]; then
            printf '%s' "$FEEDBACK_GITHUB_TOKEN" | pnpm exec wrangler secret put GITHUB_TOKEN
          fi
          if [ -n "$TURNSTILE_SECRET" ]; then
            printf '%s' "$TURNSTILE_SECRET" | pnpm exec wrangler secret put TURNSTILE_SECRET
          fi
