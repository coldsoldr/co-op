name: ci

on:
  pull_request:
    paths-ignore: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths-ignore: ['firmware/**', '.github/workflows/firmware.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @co-op/web packs:validate
      - run: pnpm --filter @co-op/web plugins:validate
      - run: pnpm build

  # Pack and plugin contributions are reviewed separately from code and from each other, so a PR
  # that mixes them gets a warning.
  pack-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # A pull_request run checks out the PR merged onto its base (refs/pull/N/merge). Its first
      # parent is the base commit GitHub merged onto, so two commits of history are all that is
      # needed, and diffing against that parent (rather than a freshly fetched base branch) cannot
      # pick up commits that landed on the base after the merge ref was made.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          packs=$(printf '%s\n' "$changed" | grep -c '^packs/' || true)
          plugins=$(printf '%s\n' "$changed" | grep -c '^plugins/' || true)
          other=$(printf '%s\n' "$changed" | grep -v -e '^packs/' -e '^plugins/' | grep -c . || true)
          echo "files changed under packs/: $packs, under plugins/: $plugins, elsewhere: $other"
          if [ "$packs" -gt 0 ] && [ "$other" -gt 0 ]; then
            echo "::warning title=Mixed pack and code changes::This PR changes $packs file(s) under packs/ and $other elsewhere. Please send pack contributions in their own PR."
          fi
          if [ "$plugins" -gt 0 ] && [ "$other" -gt 0 ]; then
            echo "::warning title=Mixed plugin and code changes::This PR changes $plugins file(s) under plugins/ and $other elsewhere. Please send plugin contributions in their own PR."
          fi
          if [ "$packs" -gt 0 ] && [ "$plugins" -gt 0 ]; then
            echo "::warning title=Mixed pack and plugin changes::This PR changes $packs file(s) under packs/ and $plugins under plugins/. Please send packs and plugins in separate PRs."
          fi

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # The runner images already carry chromium's libraries; if apt can't reach the mirrors, the browser alone is enough.
      - run: pnpm --filter @co-op/web exec playwright install --with-deps chromium || pnpm --filter @co-op/web exec playwright install chromium
      - run: pnpm --filter @co-op/web e2e
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
