name: firmware

# Host-side checks for the coop firmware in firmware/: the Python tools' unit tests on Linux and
# Windows, the C host tests on Linux. The Blackfin build itself needs the private toolchain and the
# owner's stock image, so it stays local (firmware/CLAUDE.md).

on:
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  push:
    branches: [main, dev]
    paths: ['firmware/**', '.github/workflows/firmware.yml']

permissions:
  contents: read

jobs:
  host-tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Python tool tests
        run: python -m unittest discover -s tests/tools -p 'test_*.py' -v
      - name: Host unit tests
        if: runner.os == 'Linux'
        run: make -C tests/host
