name: pages

# One Pages site holds both versions: main at /co-op/ and the dev branch at /co-op/dev/. Every
# publish rebuilds both. A dev push arrives through workflow_run, which runs this file from main,
# because the github-pages environment only deploys from main. A dev build that fails leaves
# /co-op/dev/ out of that publish and never holds main back.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [ci]
    branches: [dev]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A run started by ci is for the dev branch: publish only after its push passed.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Repository variables, empty until the Worker is deployed; the app then falls back to
      # prefilled GitHub issue links for feedback.
      - run: pnpm --filter @co-op/web build
        env:
          VITE_WORKER_URL: ${{ vars.WORKER_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - run: mv web/dist "$RUNNER_TEMP/site"
      - id: dev
        run: |
          if git ls-remote --exit-code origin refs/heads/dev; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.dev.outputs.exists == 'true'
        uses: actions/checkout@v5
        with:
          ref: dev
      - if: steps.dev.outputs.exists == 'true'
        continue-on-error: true
        uses: ./.github/actions/setup
      - id: devbuild
        if: steps.dev.outputs.exists == 'true'
        continue-on-error: true
        run: pnpm --filter @co-op/web build
        env:
          VITE_BASE: /co-op/dev/
          VITE_WORKER_URL: ${{ vars.WORKER_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - if: steps.devbuild.outcome == 'success'
        run: mv web/dist "$RUNNER_TEMP/site/dev"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  e2e:
    # A run started by ci is for the dev branch: publish only after its push passed.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @co-op/web exec playwright install --with-deps chromium
      - run: pnpm --filter @co-op/web e2e
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
