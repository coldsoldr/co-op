name = "co-op-feedback"
main = "src/index.ts"
compatibility_date = "2026-10-28"

# Secrets, set once with `wrangler secret put` and never committed:
#   GITHUB_TOKEN      fine-grained token, Issues read/write on coldsoldr/co-op only
#   TURNSTILE_SECRET  secret key of the Turnstile widget
# For `wrangler dev`, put them in worker/.dev.vars (gitignored).

[vars]
ALLOWED_ORIGINS = "https://coldsoldr.github.io,http://localhost:5173,http://localhost:4173"
GITHUB_REPO = "coldsoldr/co-op"

# Workers Rate Limiting bindings. namespace_id is any account-unique integer, as a string.
# Limits are counted per Cloudflare location, so they are a brake on abuse, not an exact quota.
#
# FEEDBACK_LIMIT: 5 requests per 60 seconds per client. The key is the CF-Connecting-IP
# address for IPv4 and its /64 prefix for IPv6, since one subscriber usually holds a whole /64.
[[ratelimits]]
name = "FEEDBACK_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# FEEDBACK_GLOBAL_LIMIT: 30 requests per 60 seconds across all clients, under the single key
# "global", so many addresses together cannot flood the issue tracker.
[[ratelimits]]
name = "FEEDBACK_GLOBAL_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# OP1FUN_LIMIT: 60 requests per 60 seconds per client for the op1.fun routes, keyed
# "op1fun-upload:<client>" and "op1fun-file:<client>" so uploads and file downloads count
# separately. Installing a pack through the file proxy fetches one file per patch, so this is
# higher than the feedback limit.
[[ratelimits]]
name = "OP1FUN_LIMIT"
namespace_id = "1003"
simple = { limit = 60, period = 60 }
