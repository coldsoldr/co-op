name = "co-op-feedback"
main = "src/index.ts"
compatibility_date = "2026-10-28"

# Secrets, set once with `wrangler secret put` and never committed:
#   GITHUB_TOKEN      fine-grained token, Issues read/write on coldsoldr/co-op only
#   TURNSTILE_SECRET  secret key of the Turnstile widget
# For `wrangler dev`, put them in worker/.dev.vars (gitignored).

[vars]
ALLOWED_ORIGINS = "https://coldsoldr.github.io,http://localhost:5173,http://localhost:4173"
GITHUB_REPO = "coldsoldr/co-op"

# Workers Rate Limiting binding: 5 feedback requests per IP per 60 seconds.
# namespace_id is any account-unique integer, as a string.
[[ratelimits]]
name = "FEEDBACK_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
